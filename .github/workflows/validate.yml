name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code@2.1.282
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/landbot
      - name: the Cursor manifest and index match the Claude manifests
        run: scripts/sync-manifests --check

  smoke:
    name: versions and guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash smoke/versions.sh
      - run: bash smoke/guards.sh
